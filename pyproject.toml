[project]
name = "pytest-playwright-pause"
version = "0.1.0"
description = "Pause Playwright tests before fixture teardown so the inspector still has a live page"
keywords = ["pytest", "playwright", "debugging", "inspector"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pytest-playwright>=0.10.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/pytest-playwright-pause" }

[project.entry-points.pytest11]
playwright_pause = "pytest_playwright_pause.plugin"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "-p no:playwright --runpytest subprocess --cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pytest_playwright_pause"]
parallel = true

[tool.coverage.report]
fail_under = 50
